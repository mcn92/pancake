// --- Test logic ---
const log = document.getElementById('log');
function emit(msg, cls = 'info') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  log.appendChild(span);
  window.scrollTo(0, document.body.scrollHeight);
}

function assert(cond, msg) {
  if (!cond) throw new Error('FAIL: ' + msg);
}

function randomVec(dim) {
  const v = new Float32Array(dim);
  for (let i = 0; i < dim; i++) v[i] = Math.random() - 0.5;
  return v;
}

(async () => {
  try {
    emit('Decoding WASM binary...');
    const wasmBinary = Uint8Array.from(atob(WASM_BASE64), c => c.charCodeAt(0));
    emit('WASM binary: ' + wasmBinary.byteLength + ' bytes');

    emit('Loading engine...');
    const engine = await P({ wasmBinary });
    emit('Engine loaded');

    const DIM = 128;
    const N = 500;
    const K = 10;

    // --- Create ---
    emit('\n--- Create index ---');
    const handle = engine._pancake_init(DIM, N + 100, 1, 1, 16, 200, 100);
    assert(handle !== 0xFFFFFFFF, 'pancake_init failed');
    emit('Index created (int8, cosine, dim=' + DIM + ')', 'pass');

    // --- Insert ---
    emit('\n--- Insert ' + N + ' vectors ---');
    const vecPtr = engine._emsc_malloc(DIM * 4);
    assert(vecPtr, 'malloc failed for vecPtr');
    const vectors = [];
    const t0 = performance.now();
    for (let i = 0; i < N; i++) {
      const v = randomVec(DIM);
      vectors.push(v);
      engine.HEAPF32.set(v, vecPtr >> 2);
      const id = engine._pancake_add(handle, vecPtr);
      assert(id !== 0xFFFFFFFF, 'insert failed at i=' + i);
    }
    const insertMs = (performance.now() - t0).toFixed(1);
    const count = engine._pancake_count(handle);
    assert(count === N, 'count mismatch: ' + count + ' vs ' + N);
    emit('Inserted ' + N + ' vectors in ' + insertMs + 'ms', 'pass');

    // --- Search ---
    emit('\n--- Search ---');
    const idPtr = engine._emsc_malloc(K * 8);
    const distPtr = engine._emsc_malloc(K * 4);
    assert(idPtr && distPtr, 'malloc failed for search buffers');

    const query = randomVec(DIM);
    engine.HEAPF32.set(query, vecPtr >> 2);
    const found = engine._pancake_query(handle, vecPtr, K, idPtr, distPtr);
    assert(found === K, 'expected ' + K + ' results, got ' + found);
    emit('Search returned ' + found + ' results', 'pass');

    // --- Search latency (100 queries) ---
    emit('\n--- Search latency ---');
    const NUM_QUERIES = 100;
    const latencies = [];
    for (let q = 0; q < NUM_QUERIES; q++) {
      const qv = randomVec(DIM);
      engine.HEAPF32.set(qv, vecPtr >> 2);
      const ts = performance.now();
      engine._pancake_query(handle, vecPtr, K, idPtr, distPtr);
      latencies.push(performance.now() - ts);
    }
    latencies.sort((a, b) => a - b);
    const p50 = latencies[Math.floor(NUM_QUERIES * 0.5)];
    const p99 = latencies[Math.floor(NUM_QUERIES * 0.99)];
    const maxLat = latencies[NUM_QUERIES - 1];
    emit('p50=' + p50.toFixed(2) + 'ms  p99=' + p99.toFixed(2) + 'ms  max=' + maxLat.toFixed(2) + 'ms (' + NUM_QUERIES + ' queries)');
    assert(p50 < 10, 'p50 search latency too high: ' + p50.toFixed(2) + 'ms');
    assert(p99 < 50, 'p99 search latency too high: ' + p99.toFixed(2) + 'ms');
    emit('Latency within bounds', 'pass');

    // --- Filtered search ---
    emit('\n--- Filtered search ---');
    const bitsetLen = (N + 7) >> 3;
    const bitsetPtr = engine._emsc_malloc(bitsetLen);
    assert(bitsetPtr, 'malloc failed for bitset');
    engine.HEAPU8.fill(0, bitsetPtr, bitsetPtr + bitsetLen);
    // Allow only even IDs
    let allowedCount = 0;
    for (let i = 0; i < N; i += 2) {
      engine.HEAPU8[bitsetPtr + (i >> 3)] |= (1 << (i & 7));
      allowedCount++;
    }
    const filteredFound = engine._pancake_query_filtered(handle, vecPtr, K, idPtr, distPtr, bitsetPtr, bitsetLen);
    assert(filteredFound > 0 && filteredFound <= K, 'filtered search returned ' + filteredFound);
    // Verify all results are even IDs
    const dv = new DataView(engine.HEAPU8.buffer);
    let allEven = true;
    for (let i = 0; i < filteredFound; i++) {
      const lo = dv.getUint32(idPtr + i * 8, true);
      if (lo % 2 !== 0) { allEven = false; break; }
    }
    assert(allEven, 'filtered search returned odd IDs');
    engine._emsc_free(bitsetPtr);
    emit('Filtered search: ' + filteredFound + '/' + K + ' results, all from allowed set', 'pass');

    // --- Delete + ghost ---
    emit('\n--- Delete ---');
    engine._pancake_delete(handle, 0);
    const ghosts = engine._pancake_ghost_count(handle);
    assert(ghosts === 1, 'ghost count should be 1, got ' + ghosts);
    emit('Deleted ID 0, ghostCount=' + ghosts, 'pass');

    // --- Compact ---
    emit('\n--- Compact ---');
    const t2 = performance.now();
    engine._pancake_compact(handle);
    const compactMs = (performance.now() - t2).toFixed(1);
    const afterCount = engine._pancake_count(handle);
    const afterGhosts = engine._pancake_ghost_count(handle);
    assert(afterCount === N - 1, 'post-compact count: ' + afterCount);
    assert(afterGhosts === 0, 'post-compact ghosts: ' + afterGhosts);
    emit('Compact in ' + compactMs + 'ms, count=' + afterCount + ', ghosts=' + afterGhosts, 'pass');

    // --- Export/Import ---
    emit('\n--- Export/Import ---');
    const sizePtr = engine._emsc_malloc(8);
    assert(sizePtr, 'malloc failed for sizePtr');
    const dataPtr = engine._pancake_export(handle, sizePtr);
    assert(dataPtr, 'export returned null');
    const exportSize = dv.getUint32(sizePtr, true);
    assert(exportSize > 0, 'export size is 0');
    const exportBytes = engine.HEAPU8.slice(dataPtr, dataPtr + exportSize);
    emit('Exported ' + exportSize + ' bytes');

    const handle2 = engine._pancake_init(DIM, N + 100, 1, 1, 16, 200, 100);
    assert(handle2 !== 0xFFFFFFFF, 'second init failed');
    const importBuf = engine._emsc_malloc(exportBytes.length);
    assert(importBuf, 'malloc failed for import');
    engine.HEAPU8.set(exportBytes, importBuf);
    const importStatus = engine._pancake_import(handle2, importBuf, exportBytes.length);
    assert(importStatus === 0, 'import failed with status ' + importStatus);
    const importCount = engine._pancake_count(handle2);
    assert(importCount === N - 1, 'imported count mismatch: ' + importCount);
    emit('Import OK, count=' + importCount, 'pass');

    // --- Search on imported index ---
    engine.HEAPF32.set(query, vecPtr >> 2);
    const found2 = engine._pancake_query(handle2, vecPtr, K, idPtr, distPtr);
    assert(found2 === K, 'search on imported index returned ' + found2);
    emit('Search on imported index: ' + found2 + ' results', 'pass');

    // --- Memory ---
    const mem = engine._pancake_memory(handle);
    emit('\nIndex memory: ' + (mem / 1024).toFixed(1) + ' KB');

    // --- Cleanup ---
    engine._emsc_free(vecPtr);
    engine._emsc_free(idPtr);
    engine._emsc_free(distPtr);
    engine._emsc_free(sizePtr);
    engine._emsc_free(importBuf);
    engine._pancake_dispose(handle);
    engine._pancake_dispose(handle2);

    emit('\n=== ALL TESTS PASSED ===', 'pass');
    window.__PANCAKE_SMOKE__ = {
      ok: true,
      perf: {
        insertMs: parseFloat(insertMs),
        searchP50Ms: parseFloat(p50.toFixed(2)),
        searchP99Ms: parseFloat(p99.toFixed(2)),
        compactMs: parseFloat(compactMs),
        vectors: N,
        dims: DIM
      }
    };

  } catch (e) {
    emit('\n' + e.message + '\n' + (e.stack || ''), 'fail');
    window.__PANCAKE_SMOKE__ = { ok: false, error: e.message };
  }
})();
</script>
