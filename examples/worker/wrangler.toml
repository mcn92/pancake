name = "pancake-search"
main = "worker.js"
compatibility_date = "2025-04-09"
compatibility_flags = ["nodejs_compat"]

[vars]
# API_KEY = "replace-me-with-a-secret"    # Uncomment to require Bearer token auth
# ALLOWED_ORIGIN = "https://yourdomain.com" # Uncomment to restrict CORS (default: *)
# RATE_LIMIT_RPM = "120"                    # Requests per minute per IP (default: no limit)

# ---------------------------------------------------------------------------
# R2 bucket — for persisting serialized indexes across deployments.
# 1. Create the bucket:   wrangler r2 bucket create pancake-indexes
# 2. Uncomment below, then redeploy.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "INDEX_BUCKET"
bucket_name = "pancake-indexes"

# ---------------------------------------------------------------------------
# KV — lighter alternative to R2 for small indexes (< 25MB value limit).
# 1. Create:  wrangler kv namespace create INDEXES
# 2. Paste the returned id below and uncomment.
# ---------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "INDEXES"
# id = "your-kv-namespace-id-here"

# ---------------------------------------------------------------------------
# Durable Objects — for mutable, strongly-consistent index state
# shared across requests (multi-tenant or live-insert workloads).
# ---------------------------------------------------------------------------
# [[durable_objects.bindings]]
# name = "SEARCH_INDEX"
# class_name = "SearchIndex"
# script_name = "pancake-search"

# [[migrations]]
# tag = "v1"
# new_classes = ["SearchIndex"]