name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger: GitHub occasionally drops workflow-run creation for a
  # push event (observed 2026-08-29 — the push triggered CodeQL but no CI
  # run object was ever created for the sha). This gives the Actions tab a
  # "Run workflow" button for exactly that case.
  workflow_dispatch:

env:
  # Browser binaries are only needed by test:browser, which has its own job.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test-committed-artifacts:
    name: Tests vs committed WASM (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # npm test = run_tests.js + model_c_loader + sketch_profile conformance;
      # running the script (not run_tests.js directly) keeps CI and the local
      # gate identical.
      - run: npm test
      - run: npm run test:fuzz

  build-from-source:
    # Rebuilds both engine variants from src/ with the pinned Emscripten
    # toolchain and runs the suite against the fresh artifacts. This is the
    # drift check: it fails loudly if the committed dist/ no longer matches
    # what src/ produces, or if an emsdk change breaks patch_engine.py's
    # exact-match patch of the minified glue.
    name: Rebuild WASM from source (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Keep in sync with the version used for the committed dist/
          # artifacts (~/emsdk on the release machine).
          version: 5.0.0
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - name: Rebuild both engine variants from src/
        run: npm run build:all
        env:
          EMCC: emcc
      - run: npm test
      - run: npm run test:simd
      # workerd entrypoint smoke (wrangler needs Node >= 20.3, so it lives in
      # this single Node 22 job rather than the version matrix).
      - run: npm run test:worker-web
      # Bundles the distilled-encoder Worker example with a Wrangler dry-run
      # and drives it under Miniflare against the abstention golden fixtures
      # (contract §5.4 asset — must run in CI, not just exist).
      - run: npm run test:worker-example

  test-browser-entry:
    name: Bundled browser consumer (Vite + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  native-build:
    # The native addon was previously never compiled in CI, so the x86 ISA
    # #elif chains had no gate at all (the AVX-512 build silently dropped
    # uint8_dot to scalar and nothing could notice). Two layers here: the
    # ISA compile sweep proves every define combination still compiles —
    # including AVX-512, which runners may not execute — and the build+test
    # runs whatever -march=native selects on this runner.
    name: Native addon (build, test, ISA compile sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ISA compile sweep over src/ headers
        run: |
          printf '#include "uint8_float_hnsw.hpp"\n#include "float_hnsw.hpp"\nint main() { return 0; }\n' > /tmp/isa_check.cpp
          set -e
          for FLAGS in \
            "-mavx512f -mavx512bw -DPANCAKE_ENABLE_AVX512_SIMD -DPANCAKE_ENABLE_AVX2_SIMD -DPANCAKE_ENABLE_SSE2_SIMD" \
            "-mavx2 -DPANCAKE_ENABLE_AVX2_SIMD -DPANCAKE_ENABLE_SSE2_SIMD" \
            "-msse2 -DPANCAKE_ENABLE_SSE2_SIMD" \
            ""; do
            g++ -std=c++17 -O2 -Isrc $FLAGS -fsyntax-only /tmp/isa_check.cpp
            echo "compiles: [${FLAGS:-scalar}]"
          done
      - name: Report runner SIMD capability
        run: grep -o 'avx512[a-z]*\|avx2\|sse2' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - run: npm ci
        working-directory: native
      - run: npm run build
        working-directory: native
      - run: npm test
        working-directory: native

  docs-site-build:
    name: Docusaurus docs site (kind-3 search)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - name: Assert kind-3 search artifact
        run: |
          test -f build/pikelet-search/search.pikelet
          node -e "const fs=require('fs'); const p='build/pikelet-search/search.pikelet'; const s=fs.statSync(p).size; if (s < 20*1024*1024) throw new Error('search.pikelet is unexpectedly small: '+s); console.log(p, (s/1048576).toFixed(2)+' MiB')"
        working-directory: docs-site

  scaffold-e2e:
    # pikelet as a user runs it: scaffold (stub embeddings, no
    # Cloudflare account), install the generated project, start its Worker
    # with wrangler dev, query /search — for both runtimes. Installs the
    # in-repo pikelet-wasm tarball into the generated project, and asserts
    # the generated dependency range equals the scaffolder's own and is
    # satisfied by the in-repo version. 0.3.0 shipped generated projects
    # pinned to ^0.2.0 while building format-v3 artifacts, so every
    # artifact-runtime project failed /search; nothing in CI ran one.
    name: pikelet generated project (scaffold, wrangler dev, /search)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:scaffold
