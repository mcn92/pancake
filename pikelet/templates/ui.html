<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pancake Search</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #59635f;
      --line: #d7ddd8;
      --accent: #14785f;
      --bg: #f7f8f5;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 18px 64px;
    }
    header {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px 120px;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }
    input, button {
      min-height: 44px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font: inherit;
      padding: 0 12px;
    }
    button {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 650;
      cursor: pointer;
    }
    .meta {
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 0.92rem;
      min-height: 22px;
    }
    .results {
      display: grid;
      gap: 10px;
    }
    article {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
    }
    article h2 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      line-height: 1.3;
      letter-spacing: 0;
    }
    article a {
      color: inherit;
    }
    .path {
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    @media (max-width: 720px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Pancake Search</h1>
      <p>Search this project with a bundled Pancake index and Workers AI query embeddings.</p>
    </header>
    <form id="search-form">
      <input id="query" name="query" autocomplete="off" placeholder="Search docs..." value="How do I configure auth?">
      <input id="k" name="k" type="number" min="1" max="8" value="5" aria-label="Top K">
      <button type="submit">Search</button>
    </form>
    <div class="meta" id="meta">Ready.</div>
    <section class="results" id="results"></section>
  </main>
  <script>
    const form = document.getElementById('search-form');
    const query = document.getElementById('query');
    const k = document.getElementById('k');
    const meta = document.getElementById('meta');
    const results = document.getElementById('results');

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeHref(value) {
      try {
        const url = new URL(String(value || ''), window.location.href);
        return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '#';
      } catch {
        return '#';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      meta.textContent = 'Searching...';
      results.innerHTML = '';
      const params = new URLSearchParams({ q: query.value.trim(), k: k.value || '5' });
      const response = await fetch('/search?' + params.toString());
      const body = await response.json();
      if (!response.ok) {
        meta.textContent = body.error || 'Search failed';
        return;
      }
      meta.textContent = `${body.result_count} results · embed ${body.embedding_ms.toFixed(2)}ms · search ${body.search_ms.toFixed(2)}ms · ${body.cache_state}`;
      results.innerHTML = body.results.map((row) => `
        <article>
          <div class="path">${escapeHtml(row.source_path || row.url || '')}</div>
          <h2><a href="${escapeHtml(safeHref(row.url))}" target="_blank" rel="noreferrer">${escapeHtml(row.title)}</a></h2>
          <p>${escapeHtml(row.preview)}</p>
        </article>
      `).join('');
    });
  </script>
</body>
</html>
